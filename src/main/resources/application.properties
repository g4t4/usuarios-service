spring.application.name=usuarios-service
server.port=8081

# --- Conexión a MySQL (se puede cambiar con variables de entorno) ---
spring.datasource.url=jdbc:mysql://localhost:3306/usuarios_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- JWT (el secreto debe tener al menos 32 caracteres; en producción usar variable de entorno) ---
jwt.secret=${JWT_SECRET:clave-secreta-siniestrofacil-duoc-2026-usuarios-service}
jwt.expiration-ms=86400000
